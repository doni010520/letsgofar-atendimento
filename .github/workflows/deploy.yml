name: Build & Push Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Lê APP_VERSION (ex.: v2.19.0) pra taguear a imagem com nome legível.
      - name: Extract app version
        id: ver
        run: echo "v=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' src/lib/version.ts | head -1)" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.v }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            NEXT_PUBLIC_SUPABASE_URL=https://ikwpkmjvkjqsfefulhdz.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlrd3BrbWp2a2pxc2ZlZnVsaGR6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNTQyMzEsImV4cCI6MjEwMDgzMDIzMX0.ABMPj54TCdbOwdP4oiWdW3Pbzv8nByTqEeig6Klgwjw
            NEXT_PUBLIC_META_GRAPH_VERSION=v23.0
